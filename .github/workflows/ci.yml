name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov ruff mypy pip-audit

      - name: Run pip-audit
        run: |
          cd backend
          pip-audit || echo "Warnings found in pip-audit"
          
      - name: Run Ruff Lint & Mypy Type Check
        run: |
          cd backend
          python -m ruff check .
          python -m mypy .
          
      - name: Run Backend Tests
        run: |
          cd backend
          python -m pytest tests/ --cov=.

  frontend-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high || echo "Warnings found in npm audit"
          
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
          
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test -- --coverage
          
      - name: Build Frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm run build
